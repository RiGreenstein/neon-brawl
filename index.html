/* ───────────────────────── AUDIO ───────────────────────── */

const ROOTS = [55, 55, 43.65, 49, 55, 55, 65.41, 49];

/* ───────────────────────── INPUT ───────────────────────── */
const keys = {}, pressed = {};

const ACTS = ['l', 'r', 'up', 'block', 'jab', 'kick', 'sp'];
const BINDS = [
  { l: ['KeyA'], r: ['KeyD'], up: ['KeyW'], block: ['KeyS'], jab: ['KeyF'], kick: ['KeyG'], sp: ['KeyH'] },
  { l: ['ArrowLeft'], r: ['ArrowRight'], up: ['ArrowUp'], block: ['ArrowDown'], jab: ['Comma'], kick: ['Period'], sp: ['Slash'] },
  { l: ['KeyJ'], r: ['KeyL'], up: ['KeyI'], block: ['KeyK'], jab: ['KeyO'], kick: ['KeyP'], sp: ['BracketLeft'] },

// extra keys for player 1 when playing alone
const SOLO = { l: ['ArrowLeft'], r: ['ArrowRight'], up: ['ArrowUp', 'Space'], block: ['ArrowDown'], jab: ['KeyJ', 'KeyZ'], kick: ['KeyK', 'KeyX'], sp: ['KeyL', 'KeyC'] };

const padCodes = a => [0, 1, 2, 3].map(i => `Pad${i}:${a}`);
const NAV = {
  up: ['KeyW', 'ArrowUp', ...padCodes('mu')], down: ['KeyS', 'ArrowDown', ...padCodes('md')],
  ok: ['Enter', 'Space', ...padCodes('ok')], back: ['Escape', 'Backspace', ...padCodes('back')]

function pollPads() {

    const s = {

  { par: .6, o: { col: '#0c0818', top: '#080512', minH: 230, maxH: 420, bw: 170, ws: 8, gap: 9, wr: 1.5, lit: .22, gapP: .5, rim: 1, shop: 1 }, fog: ['rgba(0,200,255,0)', 'rgba(0,190,255,.13)'] }

const cars = Array.from({ length: 7 }, (_, i) => ({ x: rand(W), y: 120 + i * 38 + rand(20), v: (i % 2 ? -1 : 1) * rand(1.5, 4), col: i % 2 ? '#ff5a3c' : '#bfe9ff' }));

const bgc = mk(W, HORIZ), bg = bgc.getContext('2d');

/* ───────────────────────── FIGHTERS ───────────────────────── */

// angles: 0 = down, +π/2 = forward
const P = {
  idle: [.15, .35, 2.1, -.2, 1.7, .5, -.1, -.15, -.6],
  jabW: [.05, .1, 2.5, -.2, 1.9, .5, -.1, -.15, -.6],
  jabS: [.38, 1.55, 1.62, -.6, 1.1, .65, -.12, -.3, -.8],
  kickW: [-.1, .5, 2.2, .1, 2, 1.25, -.4, -.05, -.25],

const PLASMA = { dmg: 16, kb: 14, stun: 26, en: 0, heavy: 1 };
const PAL = [
  { name: 'KAI', neon: '#00f0ff', body: '#3d4a80', dark: '#28315a', jacket: '#5266ad', metal: '#9aa6c4', skin: '#f0c2a2', hair: '#eaf8ff', style: 0 },
  { name: 'VEX', neon: '#ff2bd6', body: '#632c6c', dark: '#421d4a', jacket: '#96308a', metal: '#b59ac0', skin: '#d6a48e', hair: '#ff2bd6', style: 1 },

    ctx.textAlign = 'center'; ctx.font = `900 15px ${FONT}`;

let last = performance.now(), acc = 0;

}
requestAnimationFrame(frame);
</script>
